# Copy to fr3.yaml and configure locally. This example cannot run a robot.
schema_version: 1
arm:
  # Separate deployed ROS 2 / MoveIt 2 workspace, not this Python source tree.
  workspace: /absolute/path/to/fr3_ros_workspace
  stack: fake
  speed_scaling: 0.10
  home_pose: null
  place_flange_z_m: null
gripper:
  port: null
  baudrate: 115200
  slave_id: 9
  speed_raw: 32
  force_raw: 0
  feedback_log_dir: null
  # Optional Agent contact-close profile with a baseline measured on THIS device.
  contact_close_file: null
cameras:
  mode: wrist  # dual enables the fixed/global stream as well.
  global_serial: SET_GLOBAL_CAMERA_SERIAL
  wrist_serial: SET_WRIST_CAMERA_SERIAL
  width: 1280
  height: 720
  fps: 6
  show_window: false
observation_cache:
  enabled: true
  position_radius_m: 0.02
  orientation_radius_rad: 0.08726646259971647
  max_age_s: 30
  max_entries: 16
perception:
  parallel_candidate_workers: 2
  grasp_backend: anygrasp
  gsnet_root: /absolute/path/to/gsnet
  sam3_model_dir: /absolute/path/to/models/sam3
  grounding_dino_model: /absolute/path/to/models/grounding-dino-tiny
  anygrasp_dir: /absolute/path/to/anygrasp_sdk/grasp_detection
  anygrasp_ckpt: /absolute/path/to/anygrasp_sdk/grasp_detection/log/checkpoint_detection.tar
  anygrasp_python: /absolute/path/to/anygrasp_env/bin/python
  reference_config: ../perception/references.yaml
calibration_file: ../calibration/fr3_handeye.yaml
