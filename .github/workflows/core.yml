name: core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check published file boundary
        run: python scripts/prepare_release.py --check-tracked
      - name: Offline regression
        run: python scripts/check_core.py
      - name: Entry point imports
        run: |
          python -m app --help
          python -m skill_lab.run_agent_system --help
